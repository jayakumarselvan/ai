<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support agent test UI</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif; color: #1f2328; background: #f7f8fa; }
  header { padding: 12px 20px; background: #161616; color: #fff; font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; height: calc(100vh - 48px); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } }
  section { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; display: flex; flex-direction: column; min-height: 0; }
  h2 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid #e5e7eb; }
  .row { display: flex; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; align-items: center; }
  .row label { color: #57606a; white-space: nowrap; }
  input[type=text], input[type=password] { flex: 1; padding: 7px 9px; border: 1px solid #c9ced6; border-radius: 4px; font: inherit; min-width: 0; }
  button { padding: 7px 14px; border: 0; border-radius: 4px; background: #0f62fe; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { background: #a8b3c4; cursor: not-allowed; }
  button.secondary { background: #e5e7eb; color: #1f2328; }
  button.danger { background: #da1e28; }
  button.ok { background: #198038; }
  #chat, #queue { flex: 1; overflow-y: auto; padding: 12px 14px; min-height: 160px; }
  .msg { margin: 0 0 10px; padding: 8px 11px; border-radius: 6px; max-width: 90%; white-space: pre-wrap; word-wrap: break-word; }
  .user { background: #d0e2ff; margin-left: auto; }
  .bot { background: #f2f4f8; }
  .sys { background: #fff4d6; color: #5c4400; font-size: 13px; }
  .err { background: #ffd7d9; color: #750e13; font-size: 13px; }
  .bot p { margin: 0 0 8px; } .bot p:last-child, .bot ul:last-child, .bot ol:last-child { margin-bottom: 0; }
  .bot ul, .bot ol { margin: 0 0 8px; padding-left: 22px; }
  .bot table { border-collapse: collapse; margin: 4px 0 8px; font-size: 13px; display: block; overflow-x: auto; }
  .bot th, .bot td { border: 1px solid #c9ced6; padding: 4px 9px; text-align: left; }
  .bot th { background: #e5e7eb; }
  .bot code { background: #e5e7eb; padding: 1px 4px; border-radius: 3px; font: 12.5px ui-monospace, Menlo, monospace; }
  .bot pre { background: #161616; color: #f4f4f4; padding: 8px 10px; border-radius: 4px; overflow-x: auto; margin: 0 0 8px; }
  .bot pre code { background: none; padding: 0; color: inherit; }
  .bot h1, .bot h2, .bot h3, .bot h4 { margin: 4px 0 6px; font-size: 14px; border: 0; padding: 0; }
  .bot a { color: #0f62fe; }
  .msg.bot { white-space: normal; }
  .card { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; background: #fafbfc; }
  .card dl { margin: 0 0 8px; display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; }
  .card dt { color: #57606a; } .card dd { margin: 0; }
  .card .actions { display: flex; gap: 8px; }
  .muted { color: #57606a; }
  form.send { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #e5e7eb; }
  .hint { padding: 0 14px 10px; color: #57606a; font-size: 12px; }
</style>
</head>
<body>
<header>E-commerce support agent &ndash; test UI</header>
<main>
  <section>
    <h2>Customer chat</h2>
    <div class="row">
      <label for="ctoken">Customer token</label>
      <input id="ctoken" type="text" spellcheck="false" placeholder="CUSTOMER_TOKENS value, e.g. cust-token-123" autocomplete="off">
      <button id="newchat" class="secondary" type="button">New chat</button>
    </div>
    <div class="hint">Try: "Status of ORD-1003", "Cancel ORD-1004", "Return the keyboard from ORD-1002, wrong model, and refund me"</div>
    <div id="chat" aria-live="polite"></div>
    <form class="send" id="sendform">
      <input id="text" type="text" placeholder="Type a message..." autocomplete="off" maxlength="2000">
      <button id="send" type="submit">Send</button>
    </form>
  </section>

  <section>
    <h2>Support approvals (refunds over the threshold)</h2>
    <div class="row">
      <label for="stoken">Support key</label>
      <input id="stoken" type="text" spellcheck="false" placeholder="SUPPORT_API_KEY value, e.g. support-key-456" autocomplete="off">
      <button id="refresh" class="secondary" type="button">Refresh</button>
    </div>
    <div id="queue"><span class="muted">Enter the support key to see pending approvals.</span></div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var threadId = null, waiting = false, pollTimer = null;
  var $ = function (id) { return document.getElementById(id); };
  var chat = $("chat"), queue = $("queue");

  // Tokens live only in sessionStorage (cleared when the tab closes).
  $("ctoken").value = sessionStorage.getItem("ctoken2") || "";
  $("stoken").value = sessionStorage.getItem("stoken2") || "";
  $("ctoken").addEventListener("input", function (e) { sessionStorage.setItem("ctoken2", e.target.value); });
  $("stoken").addEventListener("input", function (e) { sessionStorage.setItem("stoken2", e.target.value); loadQueue(); });


  // ---- Minimal, safe markdown renderer (DOM nodes only; never innerHTML) ----
  function inline(parent, text) {
    var re = /(`[^`]+`)|(\*\*[^*]+\*\*)|(__[^_]+__)|(\*[^*\s][^*]*\*)|(\[[^\]]+\]\((https?:\/\/[^)\s]+)\))/g;
    var last = 0, m;
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));
      var tok = m[0], el;
      if (m[1]) { el = document.createElement("code"); el.textContent = tok.slice(1, -1); }
      else if (m[2] || m[3]) { el = document.createElement("strong"); inline(el, tok.slice(2, -2)); }
      else if (m[4]) { el = document.createElement("em"); inline(el, tok.slice(1, -1)); }
      else { el = document.createElement("a"); el.href = m[6]; el.target = "_blank"; el.rel = "noopener noreferrer"; el.textContent = tok.slice(1, tok.indexOf("]")); }
      parent.appendChild(el);
      last = m.index + tok.length;
    }
    if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));
  }

  function cells(line) {
    return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (c) { return c.trim(); });
  }
  var isSep = function (l) { return /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.indexOf("-") >= 0; };

  function renderMarkdown(container, src) {
    var lines = src.replace(/\r\n/g, "\n").split("\n"), i = 0;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }

      if (/^```/.test(line)) {                                   // fenced code
        var code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
        i++;
        var pre = document.createElement("pre"), c = document.createElement("code");
        c.textContent = code.join("\n"); pre.appendChild(c); container.appendChild(pre); continue;
      }
      if (line.indexOf("|") >= 0 && i + 1 < lines.length && isSep(lines[i + 1])) {   // table
        var tbl = document.createElement("table"), thead = document.createElement("thead"), tr = document.createElement("tr");
        cells(line).forEach(function (h) { var th = document.createElement("th"); inline(th, h); tr.appendChild(th); });
        thead.appendChild(tr); tbl.appendChild(thead);
        var tbody = document.createElement("tbody"); i += 2;
        while (i < lines.length && lines[i].indexOf("|") >= 0 && lines[i].trim()) {
          var r = document.createElement("tr");
          cells(lines[i]).forEach(function (d) { var td = document.createElement("td"); inline(td, d); r.appendChild(td); });
          tbody.appendChild(r); i++;
        }
        tbl.appendChild(tbody); container.appendChild(tbl); continue;
      }
      var h = /^(#{1,4})\s+(.*)$/.exec(line);
      if (h) { var hd = document.createElement("h" + h[1].length); inline(hd, h[2]); container.appendChild(hd); i++; continue; }

      var ul = /^\s*[-*+]\s+/, ol = /^\s*\d+[.)]\s+/;
      if (ul.test(line) || ol.test(line)) {                      // lists
        var ordered = ol.test(line), list = document.createElement(ordered ? "ol" : "ul"), rx = ordered ? ol : ul;
        while (i < lines.length && rx.test(lines[i])) {
          var li = document.createElement("li"); inline(li, lines[i].replace(rx, "")); list.appendChild(li); i++;
        }
        container.appendChild(list); continue;
      }
      var para = [];                                              // paragraph
      while (i < lines.length && lines[i].trim() && !/^```|^#{1,4}\s|^\s*[-*+]\s+|^\s*\d+[.)]\s+/.test(lines[i]) &&
             !(lines[i].indexOf("|") >= 0 && i + 1 < lines.length && isSep(lines[i + 1]))) para.push(lines[i++]);
      var p = document.createElement("p");
      para.forEach(function (t, idx) { if (idx) p.appendChild(document.createElement("br")); inline(p, t); });
      container.appendChild(p);
    }
  }

  function addMsg(cls, text) {
    var d = document.createElement("div");
    d.className = "msg " + cls;
    if (cls === "bot") renderMarkdown(d, text);   // DOM-built markdown => model output is never interpreted as HTML
    else d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  function api(path, token, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ "Authorization": "Bearer " + String(token).trim(), "Content-Type": "application/json" }, opts.headers || {});
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (body) {
        if (!r.ok) { var e = new Error(body.detail || ("HTTP " + r.status)); e.status = r.status; throw e; }
        return body;
      });
    });
  }

  function setWaiting(v) {
    waiting = v;
    $("send").disabled = v; $("text").disabled = v;
    if (!v) $("text").focus();
  }

  function handle(res) {
    threadId = res.thread_id;
    if (res.status === "pending_approval") {
      addMsg("sys", res.reply);
      setWaiting(true);
      startPolling();
    } else {
      stopPolling();
      setWaiting(false);
      addMsg("bot", res.reply || "(no reply)");
    }
    loadQueue();
  }

  function startPolling() {
    stopPolling();
    pollTimer = setInterval(function () {
      api("/chat/" + encodeURIComponent(threadId), $("ctoken").value).then(function (res) {
        if (res.status === "completed") { handle(res); }
      }).catch(function () {});
    }, 2000);
  }
  function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

  $("sendform").addEventListener("submit", function (e) {
    e.preventDefault();
    var text = $("text").value.trim();
    if (!text || waiting) return;
    if (!$("ctoken").value) { addMsg("err", "Enter the customer token first."); return; }
    addMsg("user", text);
    $("text").value = "";
    setWaiting(true);
    var body = { message: text }; if (threadId) body.thread_id = threadId;
    api("/chat", $("ctoken").value, { method: "POST", body: JSON.stringify(body) })
      .then(handle)
      .catch(function (err) {
        setWaiting(false);
        addMsg("err", err.status === 401 ? "Customer token rejected. Use a value from CUSTOMER_TOKENS in .env (the part before the colon)." : err.message);
      });
  });

  $("newchat").addEventListener("click", function () {
    stopPolling(); threadId = null; chat.textContent = ""; setWaiting(false);
  });

  function field(dl, k, v) {
    var dt = document.createElement("dt"), dd = document.createElement("dd");
    dt.textContent = k; dd.textContent = v; dl.appendChild(dt); dl.appendChild(dd);
  }

  function decide(tid, approved, btns) {
    var note = approved ? "" : (window.prompt("Reason for declining (optional):") || "");
    btns.forEach(function (b) { b.disabled = true; });
    api("/support/approvals/" + encodeURIComponent(tid) + "/decision", $("stoken").value,
        { method: "POST", body: JSON.stringify({ approved: approved, note: note }) })
      .then(loadQueue)
      .catch(function (err) { window.alert(err.status === 401 ? "Support key rejected. Use SUPPORT_API_KEY from .env." : err.message); loadQueue(); });
  }

  function loadQueue() {
    var key = $("stoken").value;
    if (!key) return;
    api("/support/approvals", key).then(function (items) {
      queue.textContent = "";
      if (!items.length) { var m = document.createElement("span"); m.className = "muted"; m.textContent = "No pending approvals."; queue.appendChild(m); return; }
      items.forEach(function (it) {
        var card = document.createElement("div"); card.className = "card";
        var dl = document.createElement("dl");
        field(dl, "Customer", it.customer_id); field(dl, "Order", it.order_id); field(dl, "Return", it.return_id);
        field(dl, "Item", it.quantity + " x " + it.item); field(dl, "Reason", it.reason);
        field(dl, "Amount", "$" + Number(it.amount).toFixed(2));
        card.appendChild(dl);
        var actions = document.createElement("div"); actions.className = "actions";
        var ok = document.createElement("button"); ok.className = "ok"; ok.textContent = "Approve";
        var no = document.createElement("button"); no.className = "danger"; no.textContent = "Decline";
        ok.addEventListener("click", function () { decide(it.thread_id, true, [ok, no]); });
        no.addEventListener("click", function () { decide(it.thread_id, false, [ok, no]); });
        actions.appendChild(ok); actions.appendChild(no); card.appendChild(actions);
        queue.appendChild(card);
      });
    }).catch(function (err) {
      queue.textContent = "";
      var m = document.createElement("span"); m.className = "muted";
      m.textContent = err.status === 401 ? "Invalid support key." : err.message;
      queue.appendChild(m);
    });
  }

  $("refresh").addEventListener("click", loadQueue);
  setInterval(loadQueue, 3000);
  loadQueue();
})();
</script>
</body>
</html>
